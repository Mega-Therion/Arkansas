name: Site quality gates

on:
  pull_request:
    paths:
      - "design-system/**"
      - "vercel.json"
      - ".github/workflows/site-quality.yml"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths:
      - "design-system/**"
      - "vercel.json"
      - ".github/workflows/site-quality.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-system
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and type-check
        run: npm run build
      - name: Check generated site assets and metadata
        run: npm run check:dist
      - name: Block vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report full dependency audit (development tooling included; some upstream advisories are unpatched or lag the backport)
        if: always()
        run: |
          set +e
          npm audit --json > audit-report.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('audit-report.json','utf8'));const v=r.metadata?.vulnerabilities||{};console.log('Full dependency audit: '+JSON.stringify(v));for(const [name,item] of Object.entries(r.vulnerabilities||{})){console.log(name+': '+item.severity+'; direct='+item.isDirect+'; fix='+JSON.stringify(item.fixAvailable));}"
          exit 0
      - name: Preserve dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: design-system/audit-report.json
          if-no-files-found: ignore
          retention-days: 14
