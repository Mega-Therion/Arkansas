name: Site quality gates

on:
  pull_request:
    paths:
      - "design-system/**"
      - "vercel.json"
      - ".github/workflows/site-quality.yml"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths:
      - "design-system/**"
      - "vercel.json"
      - ".github/workflows/site-quality.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-system
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and type-check
        run: npm run build
      - name: Check generated site assets and metadata
        run: npm run check:dist
      - name: Dependency audit
        run: |
          set +e
          npm audit --audit-level=high --json > audit-report.json
          audit_status=$?
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('audit-report.json','utf8'));const v=r.metadata?.vulnerabilities||{};console.log('Dependency audit: '+JSON.stringify(v));if(v.high||v.critical)process.exitCode=1"
          exit $audit_status
