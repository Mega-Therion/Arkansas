version: 2
updates:
  - package-ecosystem: npm
    directory: "/design-system"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    # Packages that must move together arrive in one PR. Bumped alone, each PR failed
    # `npm ci` with ERESOLVE (vite 8 vs @vitejs/plugin-react 4; react-dom 19 vs react 18).
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
    ignore:
      # TypeScript major upgrades change compiler behavior; TS 7.0.2 currently breaks CSS side-effect imports.
      # Keep majors on a dedicated compatibility branch until the full build and preview pass.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
