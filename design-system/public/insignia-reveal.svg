<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Arkansas Orchard diamond insignia</title>
  <desc id="desc">An original emerald and silver diamond mark with a slow light sweep and subtle orbiting points.</desc>
  <defs>
    <radialGradient id="bg"><stop offset="0" stop-color="#163c30"/><stop offset="1" stop-color="#0d1513"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f5e9"/><stop offset=".32" stop-color="#8ea99a"/><stop offset=".56" stop-color="#ffffff"/><stop offset="1" stop-color="#658a78"/></linearGradient>
    <linearGradient id="shine"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="clip"><path d="M400 92 520 225 400 358 280 225Z"/></clipPath>
  </defs>
  <rect width="800" height="450" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#8db6a4" stroke-opacity=".17">
    <circle cx="400" cy="225" r="154"/><circle cx="400" cy="225" r="184" stroke-dasharray="2 13"/>
    <path d="M70 225H730M400 44V406" stroke-opacity=".12"/>
  </g>
  <circle cx="400" cy="225" r="112" fill="#38e1d3" opacity=".08" filter="url(#glow)"/>
  <g>
    <path d="M400 92 520 225 400 358 280 225Z" fill="#102a21" stroke="url(#metal)" stroke-width="4"/>
    <path d="M400 92 445 225 400 358 355 225Z" fill="#6a9581" fill-opacity=".55" stroke="#d6e8dc" stroke-opacity=".75" stroke-width="1.5"/>
    <path d="M280 225 355 225 400 92M520 225 445 225 400 92M280 225 355 225 400 358M520 225 445 225 400 358" fill="none" stroke="url(#metal)" stroke-width="2"/>
    <path d="M400 92 400 358M280 225H520" stroke="#e7f3eb" stroke-opacity=".5"/>
    <path d="M400 130 486 225 400 320 314 225Z" fill="none" stroke="#38e1d3" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="400" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="44" letter-spacing="4" fill="#f5f1df">RY</text>
    <g clip-path="url(#clip)">
      <rect x="230" y="70" width="95" height="310" fill="url(#shine)" opacity=".55">
        <animate attributeName="x" values="210;540;210" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <g fill="#f0c879">
    <circle cx="400" cy="58" r="3"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="567" cy="225" r="2.5"><animate attributeName="opacity" values="1;.25;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="233" cy="225" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="392" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <text x="400" y="418" text-anchor="middle" fill="#b7cfc1" font-family="monospace" font-size="12" letter-spacing="4">ARKANSAS ORCHARD · SOVEREIGN DESIGN</text>
</svg>
